[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loom-cli"
version = "0.3.0"
description = "Loom — a hybrid local/cloud multi-agent CLI coding assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Loom" }]
keywords = ["agents", "cli", "coding-assistant", "deepagents", "ollama", "langchain"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
]

dependencies = [
    # Agent harness + orchestration. 0.7 ships lean built-in prompts (the base
    # agent prompt is empty and the tool-usage prose is gone), drops
    # TodoListMiddleware from the defaults, and lets a caller-supplied
    # FilesystemMiddleware(tools=[...]) replace the default one by name — Loom
    # owns all of that prose and tool allowlisting now. <0.8 guards the next
    # round of breaking changes.
    "deepagents>=0.7,<0.8",
    "langchain>=1.3.14",
    "langgraph>=1.0.0",
    # Model providers
    "langchain-ollama>=0.3.0",      # local models (Metal on macOS, CUDA on Linux/Windows)
    "langchain-anthropic>=1.5.3",   # cloud orchestrator / advisor / reviewer
    "langchain-openai>=0.3.0",      # optional cloud orchestrator
    "langchain-google-genai>=2.0.0",# optional cloud orchestrator
    "langchain-mcp-adapters>=0.1.9",# MCP servers (Playwright browser testing)
    "langgraph-checkpoint-sqlite>=2.0.0",  # durable session state for /resume
    # Telemetry — imported lazily and only after an explicit opt-in (the
    # default privacy mode is "none", nothing is sent anywhere without
    # consent), but hard deps so a mode the user picks in setup actually
    # works, and so the frozen binary can carry them.
    "sentry-sdk>=2.0.0",            # "bug reports" mode: scrubbed crash reports
    "langfuse>=3.0.0,<4",           # "full tracing" mode: LLM traces for training
    # CLI + UX
    "typer>=0.12.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
mlx = [
    # Optional native Apple-Silicon path. Ollama already uses Metal, so this is
    # only needed if you want to run models directly through MLX instead.
    "mlx-lm>=0.18.0; platform_system == 'Darwin'",
]
bedrock = [
    # Routes claude-* models through AWS Bedrock (or a Bedrock-compatible
    # corporate proxy) instead of the direct Anthropic API — only needed when
    # CLAUDE_CODE_USE_BEDROCK / ANTHROPIC_BEDROCK_BASE_URL is set.
    "langchain-aws>=1.4.0",
]
vertexai = [
    # Google Vertex AI (separate from the Gemini Developer API / Google AI
    # Studio, which uses langchain-google-genai and is a base dependency).
    "langchain-google-vertexai>=2.0.0",
]
[dependency-groups]
# Installed by default with `uv sync`; excluded from the published wheel.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
# Only needed to freeze standalone binaries (`uv sync --group build`); see
# packaging/. Not installed by a plain `uv sync`.
#
# langchain-aws is here, not just in the `bedrock` extra, because the binary
# has to *contain* it: a frozen bundle cannot install anything later, so any
# provider the setup wizard offers must already be inside. Bedrock costs ~30MB
# (boto3 + botocore) and is worth it. The `vertexai` extra deliberately is NOT
# bundled — google-cloud-aiplatform and pyarrow are 331MB of site-packages,
# which would dwarf the rest of the binary; `providers.is_available()` marks
# it "not installed" in the picker instead.
build = [
    "pyinstaller>=6.11",
    "langchain-aws>=1.4.0",
]

[project.scripts]
loom = "loom.cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["loom"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Lint against the oldest supported version; the code also runs on 3.12–3.14.
target-version = "py311"
