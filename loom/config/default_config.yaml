# Loom default configuration.
#
# Copied to ~/.loom/config.yaml on first run. Override any field there, or live
# with `loom config set <key> <value>`.
#
# Model strings use the LiteLLM-style "provider/model" or LangChain-style
# "provider:model" form. Both are accepted. Local models use the `ollama/`
# (or `ollama:`) prefix and are served by your local Ollama daemon, which
# transparently uses Metal on macOS and CUDA on Linux/Windows.

# The strong cloud model that plans, decomposes, and routes. Never touches raw
# tool output directly — subagents quarantine that.
orchestrator: claude-sonnet-5

# Per-subagent model assignments. Anything not cloud-prefixed runs locally.
# A role listed here always wins. A role left out inherits: `reviewer` follows
# `advisor` (the critic that gates human sign-off should be as sharp as the
# model you'd consult about the same change), everything else follows
# `general-purpose`. Add `reviewer: <model>` here to pin it to something
# cheaper or local.
subagents:
  explorer: ollama/qwen3.5:4b
  editor: ollama/qwen3.6:27b
  bash: ollama/qwen3.5:9b
  searcher: ollama/qwen3.5:4b
  general-purpose: ollama/qwen3.5:9b
  tester: ollama/qwen3.5:9b

# The strongest available model. Called on-demand only, via the `consult` tool.
advisor: claude-opus-4-8

# Where the local Ollama daemon listens.
ollama_endpoint: http://localhost:11434

# When a subagent's estimated prompt size approaches its local model's context
# window, Loom first moves that single call to the roomiest local model your
# Ollama daemon is already serving. This cloud model is the second rung — used
# only when no local model has the headroom.
escalation_model: claude-sonnet-5

# Last resort when a role's local model can't be served. If the daemon is up,
# Loom first stands the role up on another local model it IS serving; only a
# daemon that's down (or serving nothing usable) puts roles on this cheap cloud
# model for the session instead of failing mid-run. Loom tells you when this
# happens. Does not apply in --local-only or --airgap modes (those refuse to
# touch the cloud with code).
cloud_fallback: claude-haiku-4-5

# Context-window sizes (in tokens) used by the prompt-size guard to decide when
# to escalate. Any local model NOT listed here has its real context length read
# from the Ollama daemon at startup (capped by max_local_context below), so
# swapping in a model Loom doesn't ship a number for no longer means it gets
# assumed to hold only 32K. An entry here always wins over that detection.
context_windows:
  ollama/qwen3.5:4b: 32768
  ollama/qwen3.5:9b: 40960
  ollama/qwen3.6:27b: 65536
  # Legacy tags kept for configs created by earlier Loom versions.
  ollama/qwen3:4b: 32768
  ollama/qwen3:14b: 40960

# Ceiling for context windows auto-detected from Ollama. Local coders often
# advertise 128K-384K, but the KV cache for that has to fit in memory. Left
# unset, Loom sizes it from this machine's GPU memory (NVIDIA/AMD VRAM, or
# unified memory on Apple Silicon and NVIDIA Grace/Jetson parts). Set a number
# to override — raise it if you have headroom and want fewer cloud escalations.
# max_local_context: 65536

# Fraction of a model's context window at which the orchestrator auto-compacts
# and the prompt-size guard escalates a subagent call.
compaction_threshold: 0.70
escalation_threshold: 0.85

# Tool outputs larger than this many tokens are offloaded to .loom/artifacts/
# and replaced in-context with a path reference.
artifact_offload_tokens: 2000

# How many `read_file` calls the orchestrator may make itself per user turn
# before the tool is withdrawn for the rest of that turn and it has to delegate.
# The orchestrator has no ls/glob/grep at all — recon lives in explorer — but a
# strong cloud model handed `read_file` will still sweep a dozen files "just to
# be sure", which is the context pollution subagents exist to prevent, at cloud
# prices. Prompt wording does not hold that line, so the cap is enforced by
# removing the tool. Enough to confirm the paths a subagent named; not enough to
# explore. 0 forbids direct reads entirely (what --airgap does); -1 disables the
# cap and leaves the discipline to the model.
orchestrator_read_budget: 4

# When to consult the advisor automatically: low | medium | high.
# "high" => only before genuinely high-risk decisions; "low" => consult freely.
advisor_threshold: medium

# Max subagent nesting depth (a subagent may spawn one level of sub-subagent).
max_nesting_depth: 2

# Give each parallel write-capable subagent its own git worktree.
worktree_isolation: true
